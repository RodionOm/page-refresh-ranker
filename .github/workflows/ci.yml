name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t page-refresh-ranker .
      - name: start the container and check it answers
        run: |
          docker run -d --name app -p 8000:8000 page-refresh-ranker
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
